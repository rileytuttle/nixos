# Load reset file
# source-file ~/.tmux.reset.conf
#

# Make screen-256color default
set -g default-terminal "screen-256color"

# Remap prefix key to C-t
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# Window and chained pane switching 
bind-key t last-window
bind-key C-t select-pane -t :.+

# Last window hotkey
bind l last-window
bind k confirm-before -p "kill-window #W? (y/n)" kill-window

# Keybinding for reloading tmux config            
bind r source-file ~/.tmux.conf

# Keybinding to kill the current session
bind K kill-session

# Rename terminals
set -g set-titles on
set -g set-titles-string '#(whoami)::#h::#(curl ipecho.net/plain;echo)'

# Set status line
set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'
set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_bg 'red'

# Keybindings for window splitting
bind | split-window -h
bind - split-window -v
bind = split-window -v

# Replace a dead pane
bind * respawn-pane -k

# Highlight active window
# set-window-option -g window-status-current-bg red
# set -g pane-active-border-fg green
set -g window-status-current-style bg=red
set -g pane-active-border-style fg=green

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# Autorename
setw -g automatic-rename on
set-option -g allow-rename on

# Mouse mode
set-option -g mouse on

## Fingers
set -g @fingers-compact-hints 1
set -g @fingers-key f
# Same Wayland/X pick as the copy-mode `y` binding below.
set -g @fingers-copy-command 'if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; else nohup xclip -selection clipboard >/dev/null 2>&1; fi'
set -g @fingers-pattern-0 '([[:alnum:][:punct:]]{5,})'

# Vim keybindings
# hjkl for moving between panes
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R # conflicts with last window cmd

## Vim motion keys in copy mode
setw -g mode-keys vi
unbind p
bind p paste-buffer
# These four used to sit behind a pair of version gates:
#
#   run-shell "tmux setenv -g TMUX_VERSION $(tmux -V | cut -c 6-)"
#   if-shell -b '[ "$(echo "$TMUX_VERSION < 2.4" | bc)" = 1 ]'  ...
#   if-shell -b '[ "$(echo "$TMUX_VERSION >= 2.4" | bc)" = 1 ]' ...
#
# which never fired on any host. `bc` is installed by nothing in this repo,
# so both substitutions were empty, `[ "" = 1 ]` was false both times, and
# *neither* branch ran -- v/V/r/y in copy mode were simply never bound. The
# test could not have worked anyway: `tmux -V` prints a lettered version like
# `3.5a`, and `echo "3.5a >= 2.4" | bc` is a parse error even where bc exists.
# tmux 2.4 is from 2017, so the gate and the pre-2.4 branch are both gone.
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle

# Yank to the system clipboard. This was hardcoded to xclip, which does
# nothing under a Wayland session unless XWayland happens to be up and
# DISPLAY set -- so on the niri hosts `y` silently copied into a void. Pick
# at run time instead. Single-quoted so tmux passes the whole thing through
# to sh untouched; sh is what expands $WAYLAND_DISPLAY. xclip has to stay
# alive to own the X selection, hence nohup on that branch.
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; else nohup xclip -in -selection clipboard >/dev/null 2>&1; fi'

# Older tmux (including Ubuntu's) does not carry WAYLAND_DISPLAY in the
# default update-environment list, so a session that outlives a logout/login
# keeps a stale value -- or never had one -- and falls through to the xclip
# branch forever. Recent tmux already lists it and this append is then just a
# harmless duplicate entry.
set -ga update-environment "WAYLAND_DISPLAY"

 
## Vim resize keys
bind -r < resize-pane -L 1
bind -r > resize-pane -R 1
bind -r - resize-pane -D 1
bind -r + resize-pane -U 1

# Pane resize with <Alt-Arrowkey>     
bind -n M-up    resize-pane -U 1
bind -n M-down  resize-pane -D 1
bind -n M-left  resize-pane -L 1
bind -n M-right resize-pane -R 1

# Synchronize panes toggle
bind e set -g synchronize-panes
# Use the line below to query for this option
# tmux show-window-option -g synchronize-panes

# Set history scrollback
set -g history-limit 50000

# Start pane number at one
set -g base-index 0

# Window switching
bind -n S-up    new-window
bind -n S-down  confirm-before -p "kill-window #W? (y/n)" kill-window
bind -n S-left  prev
bind -n S-right next

# Pane switching
bind -n C-left  select-pane -L
bind -n C-right select-pane -R
bind -n C-down  select-pane -D
bind -n C-up    select-pane -U

# Pane special operations
bind -n C-M-up   respawn-pane -k
bind -n C-M-down   kill-pane
bind -n C-M-left   swap-pane -U
bind -n C-M-right   swap-pane -D
bind -n C-M-z   resize-pane -Z
bind -n C-M-k clear-history

# Window splitting
bind -n C-M-] split-window -v
bind -n C-M-\\ split-window -h # may need to escape the back-slash
# bind -n C-M-\ split-window -h # may need to not escape the back-slash

# Keybinding for voltron
bind v source-file ~/.tmux/voltron.session

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'Morantron/tmux-fingers'
# set -g @plugin 'laktak/extrakto'

# Everything above this line is self-contained; everything below depends on
# checkouts in $HOME that nix does not manage. Both runs are guarded now --
# an unguarded `run-shell` on a missing path raises an error on every new
# server, and these are the last lines of the file, so whatever follows a
# failure does not run.
#
# TPM itself is still a manual step on a new machine:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# then `prefix + I` to install the @plugin list above. Without it, those
# `set -g @plugin` lines are inert: no tmux-fingers (prefix+f), no copycat
# search binds, no tmux-yank, and #{prefix_highlight} in status-right
# renders empty.
if-shell '[ -e ~/extrakto/extrakto.tmux ]' 'run-shell ~/extrakto/extrakto.tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell '[ -e ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"

